{% extends 'base.html' %}

  <!-- Sidebar de Estudiante -->

  <!-- Contenedor Principal (con margen izquierdo para el sidebar en desktop) -->
  <div class="flex-1 ml-0 md:ml-64 flex flex-col min-h-screen w-full transition-all duration-300">

  </div>
</div>
{% endblock %}
