<div id="{{ id }}" class="fixed inset-y-0 right-0 w-full sm:w-[450px] bg-surface-container-lowest shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col border-l border-outline-variant/30">
  <div class="p-md border-b border-outline-variant flex items-center justify-between bg-surface-container-low">
    <h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">edit_document</span>
      {{ title }}
    </h2>
    <button class="btn-cerrar-drawer material-symbols-outlined text-on-surface-variant hover:text-error transition-colors p-1 rounded-full hover:bg-surface-container-high">close</button>
  </div>
  
  <div class="p-md flex-1 overflow-y-auto custom-scrollbar">
    <form method="POST" action="{% url 'admin_panel:courses' %}" class="flex flex-col gap-base">
      {% csrf_token %}
      <input type="hidden" name="action" value="{{ action }}">
      {% if action == 'edit_course' %}<input type="hidden" name="course_id" value="">{% endif %}
      
      <div class="flex gap-base">
        <div class="w-1/3">
          <label class="block font-label-md text-label-md text-on-surface mb-xs">Código <span class="text-error">*</span></label>
          <input name="code" required type="text" placeholder="Ej: CS101" class="w-full px-sm py-xs rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none uppercase font-bold text-on-surface">
        </div>
        <div class="flex-1">
          <label class="block font-label-md text-label-md text-on-surface mb-xs">Nombre <span class="text-error">*</span></label>
          <input name="name" required type="text" placeholder="Nombre completo" class="w-full px-sm py-xs rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none text-on-surface">
        </div>
      </div>
      
      <div>
        <label class="block font-label-md text-label-md text-on-surface mb-xs">Descripción</label>
        <textarea name="description" rows="3" placeholder="Añade una descripción sobre los temas a tratar..." class="w-full px-sm py-xs rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none text-on-surface resize-none"></textarea>
      </div>
      
      <div class="flex gap-base">
        <div class="flex-1">
          <label class="block font-label-md text-label-md text-on-surface mb-xs">Créditos <span class="text-error">*</span></label>
          <input name="credits" required type="number" min="0" max="10" value="3" class="w-full px-sm py-xs rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none text-on-surface">
        </div>
        <div class="flex-1">
          <label class="block font-label-md text-label-md text-on-surface mb-xs">Semestre <span class="text-error">*</span></label>
          <input name="level" required type="number" min="1" max="12" value="1" class="w-full px-sm py-xs rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none text-on-surface">
        </div>
      </div>
      
      <div>
        <label class="block font-label-md text-label-md text-on-surface mb-xs">Programa asociado</label>
        <select name="program_id" class="w-full px-sm py-xs rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none text-on-surface">
          <option value="">Aplica a todos los programas</option>
          {% for prog in programs %}
          <option value="{{ prog.id }}">{{ prog.name }}</option>
          {% endfor %}
        </select>
        <p class="text-label-sm text-on-surface-variant mt-1">Déjalo vacío si es una materia transversal.</p>
      </div>

      <div class="prerequisites-section">
        <label class="block font-label-md text-label-md text-on-surface mb-xs">Prerrequisitos</label>
        <div class="prerequisites-container max-h-48 overflow-y-auto border border-outline-variant rounded-lg p-xs bg-surface-container-lowest custom-scrollbar">
          {% for c in all_courses %}
          <label class="prerequisite-option flex items-center gap-sm p-sm hover:bg-surface-container-low rounded-md cursor-pointer transition-colors" data-id="{{ c.id }}" data-level="{{ c.level }}">
            <input type="checkbox" name="prerequisites" value="{{ c.id }}" class="accent-primary w-4 h-4 rounded border-outline-variant cursor-pointer">
            <span class="text-on-surface text-body-sm font-medium">{{ c.code }} - {{ c.name }} <span class="text-on-surface-variant text-label-sm">(Sem. {{ c.level }})</span></span>
          </label>
          {% endfor %}
          <div class="no-prerequisites-msg text-on-surface-variant text-label-sm text-center py-md hidden">
             No hay materias de semestres anteriores disponibles para este nivel.
          </div>
        </div>
      </div>

      <div>
        <label class="block font-label-md text-label-md text-on-surface mb-xs">Color identificador</label>
        <select name="color" class="w-full px-sm py-xs rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none text-on-surface">
          <option value="blue">Azul (Defecto)</option>
          <option value="green">Verde</option>
          <option value="purple">Morado</option>
          <option value="red">Rojo</option>
          <option value="orange">Naranja</option>
        </select>
      </div>
      
      <button type="submit" class="w-full py-md rounded-xl bg-primary text-on-primary font-label-md font-bold hover:bg-surface-tint hover:shadow-md transition-all mt-base flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[20px]">save</span>
        Guardar Materia
      </button>
    </form>
  </div>
</div>
